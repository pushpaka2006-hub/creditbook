# ==============================================================================
# TEST ENVIRONMENT CONFIGURATION (In-Memory H2 in MySQL Compatibility Mode)
# ==============================================================================

spring.application.name=creditbook-backend-test

spring.datasource.url=jdbc:h2:mem:creditbook_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

creditbook.jwt.secret=testSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026EnterpriseFinancialAppKey
creditbook.jwt.expiration-ms=3600000

creditbook.cors.allowed-origins=*
