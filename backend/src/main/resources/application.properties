# ==============================================================================
# CREDIT BOOK APPLICATION CONFIGURATION
# ==============================================================================

spring.application.name=creditbook-backend
server.port=${PORT:8080}

# Database Configuration
# Default to H2 in-memory database so the app runs without external MySQL setup.
# To use MySQL instead, set SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# or provide a Spring profile with a MySQL-specific config.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:creditbook_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (for local inspection when needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Security Configuration
# Minimum 256-bit secure secret key
creditbook.jwt.secret=${JWT_SECRET:creditBookSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026EnterpriseFinancialAppKey}
# Token Expiration: 24 hours (in milliseconds)
creditbook.jwt.expiration-ms=86400000

# CORS Allowed Origins
creditbook.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.creditbook=INFO
logging.level.org.springframework.security=WARN
